<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D84315" />
      <stop offset="50%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Car Front Silhouette -->
  <g filter="url(#shadow)" transform="translate(0, 1)">
    <!-- Car Windshield & Roof -->
    <path d="M20 23 L24 14 C24.5 13 25.5 12.5 27 12.5 L37 12.5 C38.5 12.5 39.5 13 40 14 L44 23 Z" fill="rgba(255,255,255,0.85)" />

    <!-- Car Body -->
    <path d="M14 24 C14 22.5 15.5 22 17 22 L47 22 C48.5 22 50 22.5 50 24 L52 35 C52 38 50 40 47 40 L17 40 C14 40 12 38 12 35 Z" fill="#FFFFFF" />

    <!-- Front Grille -->
    <rect x="24" y="29" width="16" height="7" rx="3.5" fill="#212121" />
    <path d="M28 31 L36 31 M28 34 L36 34" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round"/>

    <!-- Headlights -->
    <polygon points="15,26 21,26 20,29 16,30" fill="url(#goldGrad)" />
    <polygon points="49,26 43,26 44,29 48,30" fill="url(#goldGrad)" />

    <!-- Wheels / Lower Lip -->
    <rect x="13" y="38" width="8" height="5" rx="2" fill="#212121" />
    <rect x="43" y="38" width="8" height="5" rx="2" fill="#212121" />
    <rect x="21" y="39" width="22" height="3" rx="1.5" fill="rgba(255,255,255,0.7)" />

    <!-- Emblem "K" in center -->
    <circle cx="32" cy="25.5" r="3.2" fill="#D84315" />
    <text x="32" y="28" font-family="Arial, sans-serif" font-size="3.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">K</text>
  </g>
</svg>
