<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GARA Print Agent</title><style>body{font:16px system-ui;background:#f4f6f8;max-width:850px;margin:40px auto;padding:20px}section{background:white;padding:24px;border-radius:12px;margin:16px 0}input,button{font:inherit;padding:10px;margin:8px 0}input{display:block;width:90%}button{background:#ef6600;color:white;border:0;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}</style><h1>GARA Print Agent</h1><section><p>Lấy mã ghép tại trang In chứng từ của GARA bằng tài khoản Admin. Chỉ ghép một lần trên máy cắm máy in USB.</p><form id="pair"><label>Địa chỉ GARA API<input id="server" type="url" required placeholder="https://gara.example.com"></label><label>Mã ghép (hết hạn sau 5 phút)<input id="ticket" required autocomplete="off"></label><button>Ghép với GARA</button></form><p id="message" role="status"></p></section><section><h2>Trạng thái</h2><pre id="status">Đang tải…</pre><button id="refresh">Tải lại</button></section><script>async function refresh(){try{const r=await fetch('/status');const s=await r.json();document.querySelector('#status').textContent=JSON.stringify(s,null,2)}catch(e){document.querySelector('#status').textContent=e.message}}document.querySelector('#pair').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({serverUrl:document.querySelector('#server').value,ticket:document.querySelector('#ticket').value})});const s=await r.json();if(!r.ok)throw Error(s.error);document.querySelector('#ticket').value='';document.querySelector('#message').textContent='Đã ghép. Chọn máy in và khổ giấy trong GARA.';refresh()}catch(e){document.querySelector('#message').textContent=e.message}};document.querySelector('#refresh').onclick=refresh;refresh();setInterval(refresh,10000)</script></html>
